<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Transport Risk Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0a6ed1;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .tile {
      background-color: white;
      border-radius: 0.5rem;
      padding: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .tile:hover { transform: translateY(-5px); }
    .tile h2 { font-size: 1.2rem; margin: 0 0 0.5rem 0; color: #0a6ed1; }
    .tile p { margin: 0.2rem 0; }
    .risk { font-weight: bold; font-size: 1.1rem; }
    .risk.LOW { color: green; }
    .risk.MEDIUM { color: orange; }
    .risk.HIGH { color: red; }
    .ai-status {
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      display: inline-block;
      margin-top: 0.3rem;
      position: relative;
      cursor: pointer;
    }
    .AI_CORE { background-color: #0a6ed1; color: white; }
    .FALLBACK_AI { background-color: #f39c12; color: white; }
    .SYSTEM_ERROR { background-color: #e74c3c; color: white; }
    .ai-status::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 3px;
      white-space: nowrap;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .ai-status:hover::after { opacity: 1; }
    footer { text-align: center; padding: 1rem; font-size: 0.9rem; color: #555; }
    .loading { text-align: center; font-size: 1.2rem; padding: 2rem; color: #0a6ed1; }
  </style>
</head>
<body>
  <header>AI Transport Risk Dashboard</header>
  <div id="content" class="container">
    <div class="loading">Loading transports...</div>
  </div>
  <footer>&copy; 2026 DigiLab | AI & Transport Risk Demo</footer>
 
  <script>
    async function loadTransports() {
      const content = document.getElementById("content");
      content.innerHTML = '<div class="loading">Loading transports...</div>';
 
      try {
        const response = await fetch("/risk");
        const data = await response.json();
 
        content.innerHTML = "";
 
        if (!Array.isArray(data) || data.length === 0) {
          content.innerHTML = '<div class="loading">No transport data found.</div>';
          return;
        }
 
        data.forEach(tr => {
          const tile = document.createElement("div");
          tile.classList.add("tile");
 
          // Safe string conversion
          const id = tr.id || tr.transport_id || "UNKNOWN";
          const description = String(tr.description || "N/A");
          const origin = String(tr.origin || "N/A");
          const risk_level = String(tr.risk_level || "LOW");
          const risk_score = String(tr.risk_score || "0.00");
 
          // Determine badge text and tooltip
          let aiBadge = '', tooltipText = '';
          if(tr.ai_status?.status === "AI_CORE") { aiBadge = '✓ AI Score'; tooltipText = 'Scored by GPT / AI Core'; }
          else if(tr.ai_status?.status === "FALLBACK_AI") { aiBadge = '⚠ Fallback'; tooltipText = 'Fallback scoring used'; }
          else { aiBadge = '✖ Error'; tooltipText = 'System error'; }
 
          tile.innerHTML = `
            <h2>Transport ID: ${id}</h2>
            <p><strong>Description:</strong> ${description}</p>
            <p><strong>Origin:</strong> ${origin}</p>
            <p class="risk ${risk_level}"><strong>Risk Level:</strong> ${risk_level}</p>
            <p><strong>Risk Score:</strong> ${risk_score}</p>
            <p class="ai-status ${tr.ai_status?.status || 'SYSTEM_ERROR'}" data-tooltip="${tooltipText}">${aiBadge}</p>
          `;
 
          content.appendChild(tile);
        });
 
      } catch (err) {
        content.innerHTML = `<div class="loading">Error loading transports: ${err.message}</div>`;
      }
    }
 
    window.onload = loadTransports;
  </script>
</body>
</html>
