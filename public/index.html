<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Transport Risk Dashboard</title>
 
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }
 
    header {
      background: #0a6ed1;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
    }
 
    .container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
 
    .tile {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
 
    .tile h3 {
      margin: 0 0 10px;
      color: #0a6ed1;
    }
 
    .risk {
      font-weight: bold;
      font-size: 1.1rem;
    }
 
    .LOW { color: green; }
    .MEDIUM { color: orange; }
    .HIGH { color: red; }
 
    .loading, .error {
      text-align: center;
      padding: 2rem;
      font-size: 1.2rem;
    }
 
    .error {
      color: red;
    }
  </style>
</head>
 
<body>
 
<header>AI Transport Risk Dashboard</header>
 
<div id="content" class="container">
  <div class="loading">Loading transports...</div>
</div>
 
<script>
async function loadData() {
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">Loading transports...</div>';
 
  try {
    const res = await fetch("/risk");
 
    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }
 
    const data = await res.json();
 
    console.log("API RESPONSE:", data);
 
    if (!Array.isArray(data)) {
      content.innerHTML = '<div class="error">Invalid response from server</div>';
      return;
    }
 
    content.innerHTML = "";
 
    data.forEach(tr => {
      const tile = document.createElement("div");
      tile.className = "tile";
 
      const riskLevel = tr.risk_level || "LOW";
 
      tile.innerHTML = `
        <h3>${tr.id || tr.transport_id || "Transport"}</h3>
        <p><b>Description:</b> ${tr.description || "N/A"}</p>
        <p><b>Origin:</b> ${tr.origin || "N/A"}</p>
        <p class="risk ${riskLevel}">
          Risk: ${riskLevel}
        </p>
        <p><b>Score:</b> ${tr.risk_score || "0"}</p>
        <p><b>Status:</b> ${tr.ai_status?.status || "UNKNOWN"}</p>
      `;
 
      content.appendChild(tile);
    });
 
  } catch (err) {
    console.error(err);
    content.innerHTML = `<div class="error">Error: ${err.message}</div>`;
  }
}
 
window.onload = loadData;
</script>
 
</body>
</html>
